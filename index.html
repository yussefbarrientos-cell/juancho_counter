<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Reader & Speaker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87',
                            950: '#2e1065',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .pulse-speaking {
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(168, 85, 247, 0); }
            100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="p-6 text-center border-b border-purple-900/50 bg-slate-950/40">
        <div class="max-w-3xl mx-auto flex items-center justify-center space-x-3">
            <div class="p-2.5 bg-purple-600/20 text-purple-400 rounded-xl border border-purple-500/30">
                <i class="fa-solid fa-volume-high text-xl"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Number Reader & Speaker</h1>
        </div>
        <p class="text-xs sm:text-sm text-purple-300/80 mt-1">Listen carefully at 0.8x speed and repeat out loud</p>
    </header>

    <!-- Main App Container -->
    <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 flex-1 flex flex-col justify-center space-y-6">

        <!-- Main Display & Input Card -->
        <div class="bg-purple-950/40 backdrop-blur border border-purple-800/50 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <!-- Number Input Block -->
            <div>
                <label for="numberInput" class="block text-xs font-bold uppercase tracking-wider text-purple-300 mb-2">Enter Any Number</label>
                <div class="relative flex items-center">
                    <input 
                        type="text" 
                        id="numberInput" 
                        placeholder="e.g. 1452 or 1,409,500" 
                        class="w-full bg-slate-950/80 border border-purple-700/60 focus:border-purple-400 focus:ring-2 focus:ring-purple-500/30 text-2xl sm:text-3xl font-mono font-bold text-purple-100 px-5 py-4 rounded-2xl outline-none transition tracking-wide placeholder-purple-900/60"
                        value="1452"
                    >
                    <button 
                        id="clearBtn" 
                        onclick="clearInput()" 
                        class="absolute right-4 text-purple-400 hover:text-purple-200 p-2 text-sm font-semibold rounded-lg hover:bg-purple-900/50 transition"
                        title="Clear Number"
                    >
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Written Words Card (Visual Guide) -->
            <div class="bg-slate-950/60 border border-purple-900/80 rounded-2xl p-5 space-y-2">
                <div class="flex justify-between items-center text-xs text-purple-400 font-bold uppercase tracking-wider">
                    <span>Written English Words</span>
                    <i class="fa-solid fa-quote-right opacity-60"></i>
                </div>
                <p id="wordsOutput" class="text-lg sm:text-xl font-medium text-purple-200 leading-relaxed break-words font-sans">
                    One thousand four hundred fifty-two
                </p>
            </div>

            <!-- Primary Action Controls -->
            <div class="flex flex-col sm:flex-row gap-4 pt-2">
                <button 
                    id="speakBtn" 
                    onclick="speakNumber()" 
                    class="flex-1 bg-purple-600 hover:bg-purple-500 active:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-purple-900/40 transition flex items-center justify-center space-x-3 text-lg cursor-pointer"
                >
                    <i class="fa-solid fa-play text-xl" id="speakIcon"></i>
                    <span id="speakBtnText">Read / Repeat</span>
                </button>

                <button 
                    onclick="stopSpeaking()" 
                    class="bg-slate-900 hover:bg-slate-800 border border-purple-800/40 text-purple-300 font-semibold py-4 px-5 rounded-2xl transition flex items-center justify-center text-sm"
                    title="Stop Audio"
                >
                    <i class="fa-solid fa-stop mr-2"></i> Stop
                </button>
            </div>

            <!-- Subtle Speed Selector -->
            <div class="pt-2 border-t border-purple-900/40 flex items-center justify-between text-xs sm:text-sm text-purple-300">
                <span class="font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-gauge-high text-purple-400"></i> Speed Rate:
                </span>
                <div class="flex items-center space-x-2">
                    <button onclick="setSpeed(0.6)" class="speed-btn px-3 py-1 rounded-lg border border-purple-800 hover:bg-purple-900/60 transition font-mono">0.6x</button>
                    <button onclick="setSpeed(0.8)" class="speed-btn active-speed bg-purple-600 text-white font-bold px-3 py-1 rounded-lg border border-purple-400 transition font-mono">0.8x</button>
                    <button onclick="setSpeed(1.0)" class="speed-btn px-3 py-1 rounded-lg border border-purple-800 hover:bg-purple-900/60 transition font-mono">1.0x</button>
                </div>
            </div>

        </div>

        <!-- Quick Sample Presets -->
        <div class="space-y-3">
            <span class="block text-xs font-bold uppercase tracking-wider text-purple-400 text-center">Quick Practice Presets</span>
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="loadPreset('4821')" class="bg-purple-950/60 hover:bg-purple-900/60 border border-purple-800/50 text-purple-200 font-mono text-sm px-4 py-2 rounded-xl transition">4,821</button>
                <button onclick="loadPreset('15302')" class="bg-purple-950/60 hover:bg-purple-900/60 border border-purple-800/50 text-purple-200 font-mono text-sm px-4 py-2 rounded-xl transition">15,302</button>
                <button onclick="loadPreset('1409500')" class="bg-purple-950/60 hover:bg-purple-900/60 border border-purple-800/50 text-purple-200 font-mono text-sm px-4 py-2 rounded-xl transition">1,409,500</button>
                <button onclick="loadPreset('3.14159')" class="bg-purple-950/60 hover:bg-purple-900/60 border border-purple-800/50 text-purple-200 font-mono text-sm px-4 py-2 rounded-xl transition">3.14159</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-purple-400/60">
        Minimalist Listening & Speech Companion for Student Practice
    </footer>

    <!-- Text-to-Speech & Number Conversion Logic -->
    <script>
        const input = document.getElementById('numberInput');
        const wordsOutput = document.getElementById('wordsOutput');
        const speakBtn = document.getElementById('speakBtn');
        const speakIcon = document.getElementById('speakIcon');
        const speakBtnText = document.getElementById('speakBtnText');

        let playbackSpeed = 0.8;
        const synth = window.speechSynthesis;

        // English Number Words Converter
        const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
        const teens = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
        const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
        const scales = ['', 'thousand', 'million', 'billion', 'trillion'];

        function convertChunk(n) {
            let res = '';
            if (n >= 100) {
                res += ones[Math.floor(n / 100)] + ' hundred ';
                n %= 100;
            }
            if (n >= 10 && n < 20) {
                res += teens[n - 10] + ' ';
            } else if (n >= 20) {
                res += tens[Math.floor(n / 10)];
                if (n % 10 > 0) res += '-' + ones[n % 10];
                res += ' ';
            } else if (n > 0) {
                res += ones[n] + ' ';
            }
            return res.trim();
        }

        function numberToWords(str) {
            if (!str) return 'Enter a number above...';
            
            // Clean formatting commas/spaces
            let rawStr = str.replace(/,/g, '').trim();
            if (isNaN(rawStr)) return 'Please enter a valid numeric value.';
            if (rawStr === '0') return 'Zero';

            // Split decimal parts
            let parts = rawStr.split('.');
            let integerPart = BigInt(parts[0] || '0');
            let decimalPart = parts[1];

            if (integerPart === 0n && (!decimalPart || decimalPart === '')) return 'Zero';

            let words = [];
            
            if (integerPart > 0n) {
                let tempInt = integerPart;
                let scaleIdx = 0;

                while (tempInt > 0n) {
                    let chunk = Number(tempInt % 1000n);
                    if (chunk > 0) {
                        let chunkWords = convertChunk(chunk);
                        let scaleName = scales[scaleIdx] ? ' ' + scales[scaleIdx] : '';
                        words.unshift(chunkWords + scaleName);
                    }
                    tempInt /= 1000n;
                    scaleIdx++;
                }
            } else {
                words.push('zero');
            }

            let result = words.join(', ');

            // Convert decimal portion digit by digit
            if (decimalPart !== undefined && decimalPart !== '') {
                result += ' point ';
                for (let digit of decimalPart) {
                    result += (digit === '0' ? 'zero' : ones[parseInt(digit)]) + ' ';
                }
            }

            // Capitalize First Letter
            result = result.trim();
            return result.charAt(0).toUpperCase() + result.slice(1);
        }

        function updateDisplay() {
            const val = input.value;
            const converted = numberToWords(val);
            wordsOutput.innerText = converted;
        }

        function setSpeed(speed) {
            playbackSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('bg-purple-600', 'text-white', 'font-bold', 'border-purple-400');
                btn.classList.add('border-purple-800');
            });
            event.target.classList.add('bg-purple-600', 'text-white', 'font-bold', 'border-purple-400');
            event.target.classList.remove('border-purple-800');
        }

        function speakNumber() {
            if (!synth) {
                alert('Text-to-speech is not supported in this browser.');
                return;
            }

            synth.cancel(); // Stop any ongoing speech

            const textToSpeak = wordsOutput.innerText;
            if (!textToSpeak || textToSpeak.includes('Please enter')) return;

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.rate = playbackSpeed;
            utterance.lang = 'en-US';

            utterance.onstart = () => {
                speakBtn.classList.add('pulse-speaking', 'bg-purple-500');
                speakIcon.className = 'fa-solid fa-volume-high text-xl animate-bounce';
                speakBtnText.innerText = 'Speaking...';
            };

            utterance.onend = utterance.onerror = () => {
                speakBtn.classList.remove('pulse-speaking', 'bg-purple-500');
                speakIcon.className = 'fa-solid fa-play text-xl';
                speakBtnText.innerText = 'Read / Repeat';
            };

            synth.speak(utterance);
        }

        function stopSpeaking() {
            if (synth) synth.cancel();
        }

        function clearInput() {
            input.value = '';
            updateDisplay();
            input.focus();
        }

        function loadPreset(val) {
            input.value = val;
            updateDisplay();
            speakNumber();
        }

        input.addEventListener('input', updateDisplay);

        // Allow pressing Enter key to read
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                speakNumber();
            }
        });

        // Initialize on page load
        updateDisplay();
    </script>
</body>
</html>
